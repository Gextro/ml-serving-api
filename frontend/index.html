<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ML Serving Dashboard</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --accent:#f59e0b; --text:#e2e8f0; --muted:#94a3b8; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
    header { padding:20px; text-align:center; border-bottom:1px solid #334155; }
    main { max-width:900px; margin:0 auto; padding:20px; display:grid; gap:18px; grid-template-columns:1fr 1fr; }
    .card { background:var(--card); border:1px solid #334155; border-radius:14px; padding:18px; }
    .full { grid-column:1 / -1; }
    h2 { margin:0 0 12px; font-size:1rem; }
    label { font-size:.85rem; color:var(--muted); display:block; margin-top:8px; }
    input { width:100%; padding:10px; border-radius:8px; border:1px solid #475569; background:#0b1220; color:var(--text); }
    button { margin-top:12px; padding:11px 16px; border:0; border-radius:8px; background:var(--accent); color:#3b2400; font-weight:700; cursor:pointer; }
    .metric { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #334155; }
    .metric span:last-child { color:var(--accent); font-weight:700; }
    pre { background:#0b1220; padding:12px; border-radius:8px; overflow:auto; }
    @media (max-width:720px){ main{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <header>
    <h1>ML Model Serving Dashboard</h1>
    <p style="color:var(--muted);margin:6px 0 0">Iris classifier served over a monitored API</p>
  </header>
  <main>
    <section class="card">
      <h2>Predict</h2>
      <label>Sepal length (cm)</label><input id="f0" type="number" step="0.1" value="5.1" />
      <label>Sepal width (cm)</label><input id="f1" type="number" step="0.1" value="3.5" />
      <label>Petal length (cm)</label><input id="f2" type="number" step="0.1" value="1.4" />
      <label>Petal width (cm)</label><input id="f3" type="number" step="0.1" value="0.2" />
      <button onclick="predict()">Predict</button>
      <button onclick="retrain()" style="background:#334155;color:#e2e8f0">Retrain model</button>
      <pre id="result">—</pre>
    </section>

    <section class="card">
      <h2>Live metrics <button onclick="refresh()" style="margin:0 0 0 8px;padding:4px 10px;font-size:.8rem">↻</button></h2>
      <div id="metrics">Loading...</div>
    </section>
  </main>

  <script>
    const API = location.origin;

    async function predict() {
      const features = [0,1,2,3].map(i => parseFloat(document.getElementById('f'+i).value));
      const res = await fetch(`${API}/predict`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ features })
      });
      const data = await res.json();
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
      refresh();
    }

    async function retrain() {
      document.getElementById('result').textContent = 'Retraining...';
      const res = await fetch(`${API}/retrain`, { method:'POST' });
      document.getElementById('result').textContent = JSON.stringify(await res.json(), null, 2);
      refresh();
    }

    async function refresh() {
      const res = await fetch(`${API}/metrics`);
      const m = await res.json();
      const rows = [
        ['Model version', m.model_version],
        ['Model accuracy', m.model_accuracy],
        ['Total requests', m.total_requests],
        ['Error rate', m.error_rate],
        ['Avg latency (ms)', m.avg_latency_ms],
        ['p95 latency (ms)', m.p95_latency_ms],
        ['Uptime (s)', m.uptime_seconds],
      ];
      let html = rows.map(([k,v]) => `<div class="metric"><span>${k}</span><span>${v}</span></div>`).join('');
      html += `<div style="margin-top:10px;color:var(--muted)">Prediction distribution:</div>`;
      html += `<pre>${JSON.stringify(m.prediction_distribution, null, 2)}</pre>`;
      document.getElementById('metrics').innerHTML = html;
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
